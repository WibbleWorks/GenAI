name: CI

# Roadmap T6.2 / T6.5 / T6.6. Catches regressions before they ship:
#   - syntax check on all JS source
#   - version-pinning linter on pip-install lines
#   - smoke test that loads the course in a headless browser, runs every quiz
#     and every animation, and fails if any throw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check on all source
        run: |
          set -e
          for f in ai-animations.js quiz-system.js course-data.js practical-examples.js main.js loader.js; do
            node --check "$f" && echo "OK: $f"
          done

  version-pin-lint:
    name: pip-install version pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: lint
        run: node scripts/lint-version-pinning.js

  schema-validate:
    name: Lesson schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: validate
        run: node scripts/validate-lessons.mjs

  manifest-check:
    name: Lesson manifest integrity (JSON source of truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: check manifest hashes + stale files
        run: node scripts/extract-lessons.mjs --check
      - name: loader overlay harness (no browser)
        run: node scripts/test-loader.mjs
      - name: lesson schema incl. quantum-course
        run: node scripts/validate-lessons.mjs

  codeblocks:
    name: Code execution smoke (pyodide asserts + static checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install scientific stack (pinned floor)
        run: pip install "numpy>=1.26" "pandas>=2.2" "scikit-learn>=1.5" "scipy>=1.13"
      - name: behavioral labcheck smoke (starter fails, solution passes)
        run: node scripts/smoke-labchecks.mjs
      - name: static codeblock smoke (compiles + pyodide-safe imports)
        run: node scripts/smoke-codeblocks.mjs

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + chromium
        run: npx -y playwright@1.47 install --with-deps chromium
      - name: Serve + smoke test
        run: |
          python3 -m http.server 8765 >/tmp/serve.log 2>&1 &
          sleep 1
          node tests/smoke.mjs

  a11y:
    name: Accessibility audit (axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + axe-core + chromium
        run: |
          npm install --no-save @axe-core/playwright@4.10 playwright@1.47
          npx playwright install --with-deps chromium
      - name: Serve + a11y audit
        run: |
          python3 -m http.server 8765 >/tmp/serve.log 2>&1 &
          sleep 1
          node tests/a11y.mjs